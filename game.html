<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Okey</title><link rel="stylesheet" href="style.css"></head>
<body>
<header id="top-bar">
  <div class="brand"><span class="logo">7</span><span id="title" title="Adını değiştirmek için tıkla">Okey</span><input id="title-input" maxlength="28" spellcheck="false" hidden><span id="level-chip" class="chip" title="Bot zorluğu"></span></div>
  <div class="actions">
    <button id="window-btn" class="btn ghost icon" title="Ayrı pencerede aç: başka işle uğraşırken yanda açık kalsın" aria-label="Pencerede aç"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="14" height="14" rx="2"/><path d="M14 3h7v7"/><path d="M21 3l-9 9"/></svg></button>
    <button id="sound-btn" class="btn ghost icon" title="Ses ve Müzik (Aç/Kapat)" aria-label="Ses ve Müzik">
      <svg id="snd-on" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
      <svg id="snd-off" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
    </button>
    <button id="gear" class="btn ghost icon" title="Ayarlar" aria-label="Ayarlar"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </div>
</header>
<main id="table">
  <div id="d2" class="dz"></div><div id="top" class="seat"></div><div id="d1" class="dz"></div>
  <div id="left" class="seat v"></div><div id="center"></div><div id="right" class="seat v"></div>
  <div id="d3" class="dz"></div><div id="bottom-mid"><div id="hint"></div><div class="tools"><button class="btn tool" data-arrange="run" title="Seri ve perleri yan yana diz">Seri Diz</button><button class="btn tool" data-arrange="pair" title="Aynı taşları çift çift diz">Çift Diz</button></div></div><div id="d0" class="dz mine"></div>
  <div id="result" class="overlay" hidden><div class="card"><div id="res-title"></div><div id="res-sub"></div><button id="again" class="btn primary">Yeni Oyun</button></div></div>
</main>
<div id="rack"></div>
<div id="settings" class="scrim" hidden>
  <aside class="panel" role="dialog" aria-label="Ayarlar">
    <div class="panel-head"><h2>Ayarlar</h2><button id="close-settings" class="btn ghost icon" aria-label="Kapat">✕</button></div>
    <button id="new-game" class="btn primary wide">+ Yeni Oyun</button>
    <section><h3>Tema</h3>
      <div class="seg" data-key="theme">
        <button data-v="classic">Klasik</button>
        <button data-v="night">Gece</button>
        <button data-v="light">Açık</button>
        <button data-v="retro">Retro</button>

      </div></section>
    <section><h3>Grafik</h3>
      <div class="seg" data-key="gfx"><button data-v="low">Düşük</button><button data-v="good">İyi</button><button data-v="high">Çok iyi</button></div></section>
    <section class="grow"><h3>Oyun Yükle</h3><ul id="saves"></ul></section>
  </aside>
</div>
<div id="level-pick" class="overlay modal" hidden>
  <div class="card">
    <div class="card-title">Yeni Oyun</div>
    <div class="card-sub">Botların zorluğunu seç</div>
    <div class="levels">
      <button data-level="easy"><span class="lvl-badge">I</span><b>Kolay</b><small>Sık yanılır, şans senden yana</small></button>
      <button data-level="normal"><span class="lvl-badge">II</span><b>Orta</b><small>Arada bir hata yapar</small></button>
      <button data-level="hard"><span class="lvl-badge">III</span><b>Zor</b><small>Hesaplı oynar, yine de şaşar</small></button>
    </div>
    <button id="level-cancel" class="btn ghost-dark">Vazgeç</button>
  </div>
</div>
<script src="logic.js"></script><script src="store.js"></script><script src="audio.js"></script><script src="game.js"></script><script src="settings.js"></script>
</body></html>
