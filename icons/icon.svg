<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b213a"/>
      <stop offset="100%" stop-color="#3a1b5e"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" fill="url(#bg)"/>
  <!-- Stylized white O -->
  <text x="50%" y="58%" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-size="80" font-family="Arial" font-weight="bold">O</text>
  <!-- Small decorative tile pattern inside the O -->
  <g fill="#ff6ac1">
    <rect x="48" y="48" width="8" height="8"/>
    <rect x="72" y="48" width="8" height="8"/>
    <rect x="48" y="72" width="8" height="8"/>
    <rect x="72" y="72" width="8" height="8"/>
  </g>
</svg>
